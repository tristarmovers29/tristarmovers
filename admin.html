<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | TRI STAR MOVERS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#050b15;--panel:#0b1729;--gold:#d4af62;--gold2:#f0d58a;--text:#edf2f8;--muted:#aab7c9;--danger:#d9534f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b15,#0a1d37);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.box{max-width:1050px;margin:50px auto;padding:0 20px}.panel{background:rgba(8,20,37,.94);border:1px solid rgba(212,175,98,.25);border-radius:22px;padding:30px;box-shadow:0 25px 80px #0008}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.head h1{margin:0;color:var(--gold2)}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#111}.dark{background:#12233b;color:#fff;border:1px solid #34506f}.danger{background:var(--danger);color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:30px}.form .full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #29415f;background:#071323;color:#fff}input[type=file]{padding:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 9px;border-bottom:1px solid #1b3048;text-align:left;font-size:13px}.table th{color:var(--gold2)}.thumb{width:60px;height:45px;background:#fff;border-radius:7px;object-fit:contain;padding:5px}.login{max-width:440px;margin:12vh auto}.msg{padding:12px;border-radius:9px;background:#111f33;color:#d9e2ee;margin-bottom:15px;display:none}.hidden{display:none!important}.muted{color:var(--muted)}@media(max-width:650px){.form{grid-template-columns:1fr}.form .full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.table{font-size:11px}.table th,.table td{padding:8px 4px}.box{margin:25px auto}}
</style></head><body><div class="box"><div id="loginPanel" class="panel login"><h1>TRI STAR MOVERS</h1><p class="muted">Admin Login — Our Clients</p><div id="loginMsg" class="msg"></div><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required style="margin-bottom:15px"><button class="gold" type="submit">LOGIN</button></form></div><div id="adminPanel" class="panel hidden"><div class="head"><div><h1>Our Clients Management</h1><p class="muted">Add, edit, upload logos and delete clients.</p></div><button id="logout" class="dark">LOGOUT</button></div><div id="adminMsg" class="msg"></div><form id="clientForm"><input id="clientId" type="hidden"><div class="form"><div><label>Client Name *</label><input id="clientName" required></div><div><label>Category / Industry</label><input id="clientCategory" placeholder="Trading / Logistics / Manufacturing"></div><div><label>Client Logo</label><input id="clientLogo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></div><div><label>Display Order</label><input id="sortOrder" type="number" value="0"></div></div><div class="actions"><button class="gold" type="submit" id="saveBtn">ADD CLIENT</button><button class="dark hidden" type="button" id="cancelBtn">CANCEL EDIT</button></div></form><hr style="border:0;border-top:1px solid #1b3048;margin:30px 0"><h2 style="color:var(--gold2)">Current Clients</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Logo</th><th>Name</th><th>Category</th><th>Order</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="./supabase-config.js"></script><script>
(async()=>{if(!window.TRISTAR_SUPABASE_URL||window.TRISTAR_SUPABASE_URL.includes('YOUR_')){document.getElementById('loginMsg').textContent='Supabase is not configured. Add your Project URL and Anon Key in supabase-config.js.';document.getElementById('loginMsg').style.display='block';return;}const db=supabase.createClient(window.TRISTAR_SUPABASE_URL,window.TRISTAR_SUPABASE_ANON_KEY);let editing=null;const $=id=>document.getElementById(id);function msg(t){$('adminMsg').textContent=t;$('adminMsg').style.display='block';setTimeout(()=>{$('adminMsg').style.display='none'},3500)}async function check(){const {data:{session}}=await db.auth.getSession();if(!session){$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');return false}const {data,error}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(error||!data||data.role!=='admin'){await db.auth.signOut();$('loginMsg').textContent='This account is not an authorized Admin.';$('loginMsg').style.display='block';return false}$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');await load();return true}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').style.display='none';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;$('loginMsg').style.display='block';return}await check()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};async function load(){const {data,error}=await db.from('clients').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){msg(error.message);return}$('rows').innerHTML=(data||[]).map(c=>`<tr><td>${c.logo_url?`<img class="thumb" src="${esc(c.logo_url)}">`:'—'}</td><td>${esc(c.name)}</td><td>${esc(c.category||'')}</td><td>${c.sort_order}</td><td><button class="dark" onclick="editClient(${c.id})">EDIT</button> <button class="danger" onclick="deleteClient(${c.id})">DELETE</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No clients yet.</td></tr>';window._clients=data||[]}window.editClient=id=>{const c=window._clients.find(x=>x.id===id);if(!c)return;editing=c;$('clientId').value=c.id;$('clientName').value=c.name;$('clientCategory').value=c.category||'';$('sortOrder').value=c.sort_order||0;$('saveBtn').textContent='UPDATE CLIENT';$('cancelBtn').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancelBtn').onclick=()=>{editing=null;$('clientForm').reset();$('sortOrder').value=0;$('saveBtn').textContent='ADD CLIENT';$('cancelBtn').classList.add('hidden')};window.deleteClient=async id=>{const c=window._clients.find(x=>x.id===id);if(!c)return;if(!confirm(`Delete ${c.name}?`))return;const {error}=await db.from('clients').delete().eq('id',id);if(error){msg(error.message);return}if(c.logo_url){const m=c.logo_url.match(/\/storage\/v1\/object\/public\/client-logos\/(.+)$/);if(m)await db.storage.from('client-logos').remove([decodeURIComponent(m[1])])}msg('Client deleted.');await load()};$('clientForm').onsubmit=async e=>{e.preventDefault();const name=$('clientName').value.trim();if(!name)return;let logoUrl=editing?.logo_url||null;const file=$('clientLogo').files[0];if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${crypto.randomUUID()}.${ext}`;const up=await db.storage.from('client-logos').upload(path,file,{upsert:false,contentType:file.type});if(up.error){msg(up.error.message);return}logoUrl=db.storage.from('client-logos').getPublicUrl(path).data.publicUrl}const payload={name,category:$('clientCategory').value.trim(),logo_url:logoUrl,sort_order:Number($('sortOrder').value)||0,updated_at:new Date().toISOString()};let res;if(editing)res=await db.from('clients').update(payload).eq('id',editing.id);else res=await db.from('clients').insert(payload);if(res.error){msg(res.error.message);return}msg(editing?'Client updated.':'Client added.');$('cancelBtn').click();await load()};function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}await check()})();
</script></body></html>
